# Builds the Xbox UWP shell on a Windows runner and uploads a signed
# `.msix` (+ matching `.cer`) as a workflow artifact.
#
# Trigger model — opt-in per PR via a checkbox in the PR body:
#
#   - [ ] Generate Xbox Build
#
# Lifecycle:
#   * Box checked (opened/edited event)        → build runs.
#   * New commit pushed to the PR (synchronize) → box is auto-unchecked. No
#     build runs for that push; the user must re-check the box to confirm the
#     build for the new code. This prevents a stale "approved-to-build" state
#     from silently applying to whatever lands next.
#   * Manual trigger from Actions tab (workflow_dispatch) → build runs.
#
# Sideload from your Mac:
#   1. Download the `VizbeeSampleXbox-msix` artifact, unzip it.
#   2. Xbox Device Portal (https://<xbox-ip>) → Home → Add → upload the
#      .msix AND the .cer in the same dialog.
#   3. Launch from Xbox dashboard.
name: Generate Xbox Build

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # the uncheck-on-new-commit job edits the PR body

jobs:
  # When a new commit lands on the PR, sweep the box back to [ ] so the prior
  # approval doesn't carry over. GITHUB_TOKEN-initiated edits don't recurse
  # into this workflow (GitHub's loop guard), so this is safe.
  uncheck-on-new-commit:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Uncheck "Generate Xbox Build" if currently checked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
          if printf "%s" "$body" | grep -qiE '^- \[[xX]\] Generate Xbox Build'; then
            new_body=$(printf "%s" "$body" | sed -E 's/^- \[[xX]\] Generate Xbox Build/- [ ] Generate Xbox Build/')
            tmp=$(mktemp)
            printf "%s" "$new_body" > "$tmp"
            gh pr edit "$PR" --repo "$REPO" --body-file "$tmp"
            echo "Unchecked the Xbox build box on PR #$PR after new commit — re-check to build the updated code."
          else
            echo "Box was already unchecked — nothing to do."
          fi

  # Builds only when (a) the PR body has the box checked, OR (b) manual run.
  # contains() is case-sensitive but GitHub's web UI always writes lowercase
  # [x], so this catches the realistic case.
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request'
       && (github.event.action == 'opened' || github.event.action == 'edited')
       && contains(github.event.pull_request.body, '- [x] Generate Xbox Build'))
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platforms/xbox/shell
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest has VS 2022 Build Tools preinstalled; this just pins
      # `msbuild` onto PATH so subsequent steps can call it directly.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Snapshot what's actually on the runner. Saved us last time when the
      # only Windows SDK present was 10.0.26100 — TargetPlatformVersion has
      # to match something installed here.
      - name: Diagnose UWP toolchain on the runner
        working-directory: .
        run: |
          Write-Host "=== VS installations (vswhere) ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -prerelease -products * -format json | ConvertFrom-Json |
              ForEach-Object { "$($_.displayName) → $($_.installationPath)" }
            Write-Host ""
            Write-Host "=== Installed workloads (looking for Universal) ==="
            $uwp = & $vswhere -all -prerelease -products * -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
            if ([string]::IsNullOrWhiteSpace($uwp)) { Write-Host "(empty ⇒ UWP workload NOT installed)" } else { Write-Host "$uwp  ✓ UWP workload installed" }
          } else {
            Write-Host "vswhere.exe not found"
          }

          Write-Host ""
          Write-Host "=== Windows 10/11 SDK references on disk ==="
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\References"
          if (Test-Path $kits) { Get-ChildItem $kits -Directory | Select-Object -ExpandProperty Name } else { Write-Host "no Windows Kits References folder" }

          Write-Host ""
          Write-Host "=== MSBuild version ==="
          msbuild -version -nologo

      - name: Install UWP workload (if missing)
        working-directory: .
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -all -prerelease -products * -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
          if ([string]::IsNullOrWhiteSpace($installed)) {
            Write-Host "UWP workload missing — installing via VS Installer (this takes a few minutes)…"
            $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $anyVs = & $vswhere -all -prerelease -products * -property installationPath | Select-Object -First 1
            if (-not $anyVs) { Write-Error "No VS installation found to add workload to"; exit 1 }
            & $vsInstaller modify `
              --installPath "$anyVs" `
              --add Microsoft.VisualStudio.Workload.Universal `
              --add Microsoft.VisualStudio.Component.UWP.Support `
              --includeRecommended --quiet --norestart --nocache | Out-Null
            $exit = $LASTEXITCODE
            if ($exit -ne 0) { Write-Error "VS Installer modify failed with exit $exit"; exit $exit }
            Write-Host "UWP workload installed."
          } else {
            Write-Host "UWP workload already installed at: $installed"
          }

      # Stamp the run number into the manifest version so every build produces
      # a unique, visible identifier (e.g. 0.1.0.42). This is the single most
      # useful verification signal: the version in the .msix filename,
      # the sticky PR comment, and Device Portal's app list all agree, so you
      # can confirm at a glance which build is actually installed.
      - name: Bump manifest version with run number
        run: |
          $version = "0.1.0.${{ github.run_number }}"
          $manifest = "Package.appxmanifest"
          # -creplace (case-sensitive) so we don't also match the XML
          # declaration's lowercase `version="1.0"` and corrupt line 1.
          (Get-Content $manifest -Raw) -creplace 'Version="[0-9.]+"', "Version=`"$version`"" |
            Set-Content $manifest -NoNewline
          Write-Host "Bumped manifest version to $version"
          Select-String -Path $manifest -Pattern 'Version=' -CaseSensitive | Select-Object -First 1

      - name: Restore NuGet packages
        run: nuget restore VizbeeSampleXbox.sln

      # Self-signed dev cert. CN MUST match Package.appxmanifest's Publisher
      # (CN=Vizbee), otherwise MSIX signing fails with `error APPX0102`.
      - name: Generate dev signing certificate
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Vizbee" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Vizbee Sample Dev Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "vizbee" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath VizbeeSampleXbox_TemporaryKey.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath VizbeeSampleXbox_TemporaryKey.cer | Out-Null
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Generated cert with thumbprint $($cert.Thumbprint)"

      - name: Build MSIX (Release | x64 | Sideload)
        run: |
          # AppxBundle=Never: Xbox is x64-only, no multi-arch bundle needed.
          # Bundling a SideloadOnly .msix payload also fails on older platform
          # mins (we target 10.0.17763.0) with APPX 0x80080215 ("Non appx
          # extensions are not allowed for payload packages targeting older
          # platforms"). Single .msix is what Device Portal sideload expects.
          msbuild VizbeeSampleXbox.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundlePlatforms=x64 `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=VizbeeSampleXbox_TemporaryKey.pfx `
            /p:PackageCertificatePassword=vizbee `
            /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT `
            /p:GenerateAppxPackageOnBuild=true `
            /restore `
            /verbosity:minimal

      - name: Upload sideload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: VizbeeSampleXbox-msix
          # AppxBundle=Never emits a single .msix (no .msixbundle); MSBuild
          # places it under either AppPackages\…_Test\ or bin\x64\Release\
          # depending on the run, so glob both.
          path: |
            platforms/xbox/shell/AppPackages/**/*.msix
            platforms/xbox/shell/bin/**/*.msix
            platforms/xbox/shell/VizbeeSampleXbox_TemporaryKey.cer
          if-no-files-found: error
          retention-days: 14

      # Post (or update — using a hidden marker as the lookup key) a sticky
      # comment on the PR with the artifact download link, so reviewers don't
      # have to dig through the Actions tab. Skipped for workflow_dispatch
      # (no PR to comment on).
      - name: Post download link as a PR comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- xbox-build-artifact -->"
          short_sha=${SHA:0:7}
          body=$(cat <<EOF
          $marker
          ### 🎮 Xbox build ready

          **Download:** [VizbeeSampleXbox-msix.zip]($ARTIFACT_URL)
          Contains \`VizbeeSampleXbox_*.msix\` + \`VizbeeSampleXbox_TemporaryKey.cer\`. Sideload via Xbox Device Portal → Home → Add.

          - **Version:** \`0.1.0.${{ github.run_number }}\` (look for this in Device Portal → My games & apps to confirm install)
          - **Commit:** \`$short_sha\`
          - **Run logs:** [Actions run]($RUN_URL)
          - **Expires:** 14 days from now

          > Push a new commit to this PR to invalidate this build — the checkbox auto-unchecks and you'll need to re-check it to build the updated code.
          EOF
          )
          existing=$(gh api "repos/$REPO/issues/$PR/comments" \
                       --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
            echo "Updated existing build-artifact comment on PR #$PR"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Posted new build-artifact comment on PR #$PR"
          fi
